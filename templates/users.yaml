# Per-user configuration for Bjornheim AI. users.yaml is mandatory; the
# daemon fails closed at startup if it cannot find or parse it.
#
# Canonical paths:
#   protected installs (`make install`, which invokes sudo): /etc/kai/users.yaml
#   single-user installs (`make config` then `make run`):
#       ${XDG_CONFIG_HOME:-$HOME/.config}/kai/users.yaml
#
# `make config` writes the correct location for the deployment mode
# you select. KAI_USERS_YAML can override either for tests/dev.
#
# Required fields per user: name, and at least one of telegram_id/discord_id
# (a user may have either, or both - each is independently optional but at
# least one authorization key is required).
# All other fields are optional. Omitted fields inherit installation
# defaults from the backend/provider model registry, .env or /etc/kai/env,
# and the hardcoded defaults documented in the templates/.env header.

users:
  # Example: admin user with full settings
  - telegram_id: 123456789
    # discord_id: 987654321098765432   # Discord snowflake ID (optional;
    #   only DMs are supported - the discord adapter ignores messages from
    #   guild/server channels). At least one of telegram_id/discord_id is
    #   required per user; a user may have both (independent principals,
    #   history, and memory per transport - not merged) or either alone.
    name: alice
    role: admin              # "admin" or "user" (default: "user")
    github: alice             # GitHub username for webhook routing
    # os_user: alice          # OS user for subprocess isolation
    # home_workspace: ~/projects/main  # per-user home workspace

    # External services this user's persistent agent may call through
    # Bjornheim AI's credential-injecting proxy. Omission means no services, even
    # for admins. Names must match enabled entries in services.yaml.
    allowed_services:
      - perplexity

    # workspace_base: directory for /workspace new and name resolution.
    # /workspace <name> looks for subdirectories under this path.
    # Inherits the global WORKSPACE_BASE installation default if unset.
    # workspace_base: ~/projects

    # Backend override. When omitted, this user inherits the installation
    # default selected during `make config`. Protected installs accept only
    # backend identifiers present in admin-owned /etc/kai/backends.yaml;
    # users cannot configure executable paths here. Supported identifiers:
    # "claude", "codex", "goose", "opencode", and "pi". Goose, OpenCode,
    # and Pi also require a provider. OpenCode models use full
    # "provider/model" IDs and authentication is managed by
    # `opencode auth login`; Pi models use "provider/model[:thinking]" and
    # authentication is managed by Pi for the target OS user.
    # backend: goose
    # provider: openai    # required for goose, opencode, and pi (selects the model registry)

    # Optional per-user model and timeout defaults. Users can override the
    # conversational model and timeout at runtime via /model and /settings.
    # Omitted model roles inherit the selected backend/provider/role defaults
    # from the model registry. Model identifiers must match that backend's
    # surface; OpenCode uses full provider/model IDs.
    # models:
    #   agent: gpt-5.5-pro
    #   pr_review: gpt-5.5
    # timeout: 300            # response timeout in seconds (max 600)

    # GitHub settings. github_repos is the admin-controlled authorization
    # boundary for GitHub review and triage operations, as well as the
    # initial notification list. Omission grants no review/triage authority,
    # even to admins. `/github add` can add notification subscriptions but
    # never expands this operations allowlist. pr_review and issue_triage
    # toggle automated processing. github_notify_chat_id sends notifications
    # to a separate chat (e.g., a Telegram group) instead of the DM.
    # github_repos:
    #   - alice/my-project
    #   - alice/other-repo
    # github_notify_chat_id: -100123456789
    # pr_review: true
    # issue_triage: true
    # Issue triage can comment and apply existing repo labels when enabled.
    # Project-board assignment is additionally fail-closed: list exact GitHub
    # Project titles here if Bjornheim AI may add this user's triaged issues to them.
    # allowed_triage_projects:
    #   - Sprint 1
    #   - Bug triage

    # Guardian monitoring. guardian_of lists other users.yaml `name`
    # values this user may read via workshop/guardian_access.py - static,
    # config-driven authorization, not a database-backed grant. Independent
    # of monitored (below): granting guardian_of doesn't require the
    # target to be monitored, and monitored doesn't require any guardian
    # to be configured for them.
    # guardian_of:
    #   - carol

  # Example: regular user with minimal config
  # - telegram_id: 987654321
  #   name: bob

  # Example: a monitored user (e.g. a child's account). monitored flags
  # this user's turns for the safety-flagging pipeline; it does not by
  # itself grant anyone read access - pair it with guardian_of on the
  # guardian's own entry above.
  # - discord_id: 111222333444555666
  #   name: carol
  #   monitored: true
